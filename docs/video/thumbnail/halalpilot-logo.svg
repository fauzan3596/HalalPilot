<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- HalalPilot — logo demo (buatan sendiri, bukan logo BPJPH/halal Indonesia). Hijau tua + jarum kompas (pilot). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#215C3F"/>
      <stop offset="1" stop-color="#143B29"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- cincin kompas -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#F4EBD0" stroke-opacity="0.18" stroke-width="10"/>
  <!-- tanda arah utama -->
  <g fill="#F4EBD0" fill-opacity="0.35">
    <rect x="250" y="44" width="12" height="30" rx="4"/>
    <rect x="250" y="438" width="12" height="30" rx="4"/>
    <rect x="44" y="250" width="30" height="12" rx="4"/>
    <rect x="438" y="250" width="30" height="12" rx="4"/>
  </g>
  <!-- jarum kompas: kuning ke utara-timur, gading ke selatan-barat -->
  <g transform="rotate(38 256 256)">
    <polygon points="256,72 292,256 256,236 220,256" fill="#E9C46A"/>
    <polygon points="256,440 292,256 256,276 220,256" fill="#F4EBD0" fill-opacity="0.85"/>
  </g>
  <!-- monogram -->
  <text x="256" y="292" text-anchor="middle" font-family="Segoe UI, Inter, Arial, Helvetica, sans-serif" font-weight="800" font-size="150" fill="#FFFFFF" letter-spacing="-6">HP</text>
  <circle cx="256" cy="256" r="16" fill="#143B29" stroke="#E9C46A" stroke-width="6"/>
</svg>
