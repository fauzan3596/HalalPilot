# Salinan entri lampiran KMA 1360/2021 yang dibaca (audit trail; tidak dipakai mesin)
kma_lampiran_dibaca:
  halaman: "5–15 dari 182"
  a1_tumbuhan: [Buah segar, Sayuran segar, Sayuran kering, Serealia, Umbi-umbian segar, Umbi-umbian kering, Kacang-kacangan segar, Kacang-kacangan kering, Rumput laut segar, Rumput laut kering, Beras jagung, Oat murni, Wheat gluten murni, Kelapa parut kering, Kelapa murni, Air kelapa murni, Kulit/kembang tahu murni, Bungkil kedelai murni, Bungkil kacang tanah murni, Tahu kedelai tradisional murni, Chlorella ellipsoides, Spirulina spp, Scenedesmus spp, Galactomannan, Kulit Kina, Serbuk Agar, Gom Akasia Murni, Minyak atsiri, Minyak kayu manis, Serbuk coklat, Menthol, Minyak orange, Pepermint]
  a2_hewan_non_sembelihan: [Susu segar, Telur segar, Ikan segar, Ikan dibekukan, Ikan dikeringkan, Ikan diasinkan, Belalang segar/dikeringkan, Malam Kuning (cera flava), Malam Putih (cera alba)]
  a3_fermentasi: [Tape, Oncom merah, Oncom hitam, Dadih, Tempe]
  a4_air: [Air dari sumber mata air/air tanah, Air untuk injeksi, Es batu]
  b_tidak_berisiko: [Kasa pembalut, Kapas murni, Pembalut krep katun, Polimer berbasis selulosa, Selulosa dan turunannya (diasetat, asetat, eter, triasetat, CMC, Na-CMC), Polimer sintetik (PE, PS, poliamin, poliuretan, polieter, poliurea, poliakrilat, PVP, PVC, PVA)]
  c1_tambang: [Magnesium Oksida, Zink oksida, E171 Titanium dioksida, Bentonite, Diatomaceous earth, Kaolin, Zeolite, Activated Alumina, Perlite, Parafin, Natrium Klorida, Diatomite, Batu bara, Kalsium oksida, Silikon dioksida, Timah (II) oksida, Batu kapur, Tanah liat]
  c2_sintesis_pangan_hal10_11: [Tawas, Amonia, Amonium Klorida, Asam Alginat, Asam Asetat, Asam Benzoat, Asam Fosfat, Asam Sorbat]
  c2_sintesis_hal12_182:
    dibaca: "10 Sep 2026, 6 pembaca paralel, seluruh halaman terbaca; tabel berakhir no. 4038 (hal. 182) disusul tanda tangan Menteri Agama"
    ringkasan: "Didominasi farmasi (hal. 12-25), perisa/fragrans (hal. 26-116, 128-131, 155-160), pewarna rambut/tabir surya/surfaktan (hal. 133-135, 161-164, 170). Entri pangan terkonsentrasi di hal. 12-30 (BTP dasar), 120-127 (fosfat, mineral, gas), 136-156 (pewarna, pengawet), 178-182 (blok E-number)."
    tidak_ditemukan_di_lampiran: [asam sitrat, asam laktat, MSG, lesitin, gliserol, pektin, maltodekstrin, dekstrin, xanthan, aspartam, sukralosa, sorbitol, xylitol, kalium bitartrat, Fast Green FCF, Patent Blue V]
    catatan_kualitas: "Beberapa CAS di dokumen keliru/tidak lengkap (mis. kalsium karbonat '471-341-1', HPMC '9004-32-4'/'9004-65', etil vanilin '121-33-5'); nomor entri yang dicatat tetap merujuk dokumen. Kalium bromat (no.4035) tercantum namun dilarang di Indonesia -> kelas berbahaya."
