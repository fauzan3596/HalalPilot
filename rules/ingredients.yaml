# Kamus klasifikasi bahan HalalPilot.
# Kelas (harus cocok dengan CHECK ingredient.kelas di db/schema.sql):
#   dikecualikan_A : bahan dari alam tanpa/diolah fisik saja — KMA 1360/2021 bagian a (a.1 tumbuhan, a.2 hewan non-sembelihan, a.3 fermentasi mikroba, a.4 air alam)
#   dikecualikan_B : bahan olahan tidak berisiko — KMA 1360/2021 bagian b (kebanyakan non-pangan; CMC relevan pangan)
#   dikecualikan_C : bahan kimia tambang/pemurnian & sintesis — KMA 1360/2021 bagian c (hanya entri yang relevan pangan yang dimuat)
#   positif        : bahan olahan yang lazim bersertifikat; agent minta merek/pemasok, sertifikat merek dianggap cukup (tidak WAJIB sertifikat)
#   kritis         : bahan berisiko; WAJIB sertifikat halal pemasok (rule E11)
#   tidak_dikenal  : tidak ada di kamus → konfirmasi UMK (rule E12)
#
# SUMBER: lampiran KMA 1360/2021 dibaca langsung dari salinan resmi (PDF scan, SELURUH 182 halaman; hal. 5-15 pada 5 Sep, hal. 12-182 pada 10 Sep 2026).
# Bagian c.2 (bahan kimia sintesis, no. 1-4038) didominasi farmasi & perisa/fragrans; hanya entri yang relevan label pangan yang dimuat (nomor entri dicatat).
# Kelas 'positif' dan 'kritis' BUKAN dari KMA; disusun dari praktik LPH/SJPH dan harus divalidasi pendamping (P3H).
version: "2026-09-10.3"

